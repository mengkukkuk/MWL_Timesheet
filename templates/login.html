<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Team Work Log</title>
    <!-- Fonts for the React islands: Kanit (body/Thai-safe), Syne (display),
         DM Mono (data). Loaded here so the login bundle ships no font CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- i18n bridge: the React island reuses window.t()/toggleLang() from here. -->
    <script src="/static/app/i18n.js?v={{ static_v('app/i18n.js') }}"></script>
    {% set assets = vite_asset('login') %}
    {% for href in assets.css %}
    <link rel="stylesheet" href="{{ href }}">
    {% endfor %}
</head>
<body>
    <div id="login-root"></div>
    {% for src in assets.js %}
    <script type="module" src="{{ src }}"></script>
    {% endfor %}
</body>
</html>
