<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Team Work Log</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" integrity="sha384-HtMZLkYo+pR5/u7zCzXxMJP6QoNnQJt1qkHM0EaOPvGDIzaVZbmYr/TlvUZ/sKAg" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app/i18n.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="login-card" style="position:relative">
        <!-- Language toggle -->
        <div style="position:absolute;top:1rem;right:1rem">
            <button id="lang-toggle-btn" onclick="toggleLang()" class="text-xs font-semibold px-2 py-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">TH</button>
        </div>

        <div class="flex items-center justify-center gap-3 mb-6">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-800" data-i18n="login.title">Team Work Log</h1>
        </div>

        <div id="login-error" class="error-msg hidden"></div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <h2 class="text-lg font-semibold text-gray-700 mb-4" data-i18n="login.sign_in">Sign In</h2>
            <div class="space-y-3">
                <div>
                    <label class="label" data-i18n="login.username">Username</label>
                    <input type="text" id="login-username" class="input-field w-full" required autocomplete="username">
                </div>
                <div>
                    <label class="label" data-i18n="login.password">Password</label>
                    <input type="password" id="login-password" class="input-field w-full" required autocomplete="current-password">
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none">
                    <input type="checkbox" id="login-remember" class="rounded">
                    <span data-i18n="login.remember">Remember me</span>
                </label>
            </div>
            <button type="submit" class="btn-primary w-full mt-4" id="login-btn" data-i18n="login.login_btn">Login</button>
            <div class="flex items-center justify-between mt-4">
                <p class="text-sm text-gray-500">
                    <span data-i18n="login.no_account">Don't have an account?</span>
                    <button type="button" onclick="toggleForm('register')" class="text-indigo-600 hover:underline font-medium" data-i18n="login.create_link">Create Account</button>
                </p>
                <button type="button" onclick="toggleForm('reset')" class="text-sm text-gray-400 hover:text-indigo-600 hover:underline" data-i18n="login.forgot_pw" hidden="hidden">Forgot password?</button>
            </div>
        </form>

        <!-- Reset Password Form -->
        <form id="reset-form" class="hidden" onsubmit="handleResetPassword(event)">
            <h2 class="text-lg font-semibold text-gray-700 mb-2" data-i18n="login.reset_title">Reset Password</h2>
            <p class="text-xs text-gray-500 mb-4" data-i18n="login.reset_desc">Enter your username and Staff ID to verify your identity.</p>
            <div class="space-y-3">
                <div>
                    <label class="label" data-i18n="login.username">Username</label>
                    <input type="text" id="reset-username" class="input-field w-full" required autocomplete="username">
                </div>
                <div>
                    <label class="label" data-i18n="login.staff_id">Staff ID</label>
                    <input type="text" id="reset-staffid" class="input-field w-full" required placeholder="e.g. EMP-001">
                </div>
                <div>
                    <label class="label" data-i18n="login.password">New Password</label>
                    <input type="password" id="reset-password" class="input-field w-full" required autocomplete="new-password" minlength="8" placeholder="Min. 8 characters">
                </div>
                <div>
                    <label class="label" data-i18n="login.confirm_password">Confirm Password</label>
                    <input type="password" id="reset-password2" class="input-field w-full" required autocomplete="new-password">
                </div>
            </div>
            <button type="submit" class="btn-primary w-full mt-4" id="reset-btn" data-i18n="login.reset_btn">Reset Password</button>
            <p class="text-center text-sm text-gray-500 mt-4">
                <button type="button" onclick="toggleForm('login')" class="text-indigo-600 hover:underline font-medium" data-i18n="login.sign_in_link">Sign In</button>
            </p>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
            <h2 class="text-lg font-semibold text-gray-700 mb-4" data-i18n="login.create_title">Create Account</h2>
            <div class="space-y-3">
                <div>
                    <label class="label" data-i18n="login.username">Username</label>
                    <input type="text" id="reg-username" class="input-field w-full" required autocomplete="username">
                </div>
                <div>
                    <label class="label" data-i18n="login.password">Password</label>
                    <input type="password" id="reg-password" class="input-field w-full" required autocomplete="new-password" minlength="8" data-i18n-ph="modal.new_pw_ph" placeholder="Min. 8 characters">
                </div>
                <div>
                    <label class="label" data-i18n="login.confirm_password">Confirm Password</label>
                    <input type="password" id="reg-password2" class="input-field w-full" required autocomplete="new-password">
                </div>
                <hr class="my-2">
                <p class="text-xs text-gray-500" data-i18n="login.employee_lookup_hint">Link to your HR record:</p>
                <div>
                    <label class="label" data-i18n="login.employee_id">Employee ID</label>
                    <input type="text" id="reg-employee-id" inputmode="numeric" pattern="[0-9]*"
                           class="input-field w-full" required
                           placeholder="12345" autocomplete="off">
                    <p id="reg-emp-status" class="mt-1.5 text-xs hidden"></p>
                    <div id="reg-emp-preview"
                         class="mt-2 p-2.5 rounded-md bg-gray-50 border border-gray-200 hidden">
                        <div class="text-[11px] uppercase tracking-wide text-gray-400 font-semibold mb-1"
                             data-i18n="login.emp_record_label">From HR record</div>
                        <div class="text-sm font-semibold text-gray-800" id="reg-emp-name">—</div>
                        <div class="text-xs text-gray-500" id="reg-emp-dept">—</div>
                        <div class="text-xs text-gray-500" id="reg-emp-position">—</div>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-primary w-full mt-4" id="reg-btn" data-i18n="login.create_link">Create Account</button>
            <p class="text-center text-sm text-gray-500 mt-4">
                <span data-i18n="login.have_account">Already have an account?</span>
                <button type="button" onclick="toggleForm('login')" class="text-indigo-600 hover:underline font-medium" data-i18n="login.sign_in_link">Sign In</button>
            </p>
        </form>
    </div>

    <script>
        // ── Remembered-credentials store ──
        // Pluggable abstraction. Today: username only (mode 'username').
        // To enable password later: switch _REMEMBER_MODE to 'username_password'
        // and the save/load methods below will round-trip the password too.
        // SECURITY NOTE: storing a plaintext password in localStorage is vulnerable to XSS.
        // Only enable 'username_password' if the team has accepted that tradeoff.
        const _REMEMBER_KEY  = 'login.remember.v1';
        const _REMEMBER_MODE = 'username';   // 'username' | 'username_password'
        const RememberStore = {
            load() {
                try {
                    const raw = localStorage.getItem(_REMEMBER_KEY);
                    if (!raw) return null;
                    const obj = JSON.parse(raw);
                    return (obj && obj.mode) ? obj : null;
                } catch (e) { return null; }
            },
            save(username, password) {
                try {
                    const payload = { mode: _REMEMBER_MODE, username: username || '' };
                    if (_REMEMBER_MODE === 'username_password') payload.password = password || '';
                    localStorage.setItem(_REMEMBER_KEY, JSON.stringify(payload));
                } catch (e) {}
            },
            clear() { try { localStorage.removeItem(_REMEMBER_KEY); } catch (e) {} },
        };

        function applyRememberedCredentials() {
            const saved = RememberStore.load();
            if (!saved) return;
            const u = document.getElementById('login-username');
            const p = document.getElementById('login-password');
            const cb = document.getElementById('login-remember');
            if (u && saved.username) u.value = saved.username;
            if (p && saved.mode === 'username_password' && saved.password) p.value = saved.password;
            if (cb) cb.checked = true;
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyRememberedCredentials);
        } else {
            applyRememberedCredentials();
        }

        function toggleForm(form) {
            document.getElementById('login-form').classList.toggle('hidden', form !== 'login');
            document.getElementById('register-form').classList.toggle('hidden', form !== 'register');
            document.getElementById('reset-form').classList.toggle('hidden', form !== 'reset');
            document.getElementById('login-error').classList.add('hidden');
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const pw  = document.getElementById('reset-password').value;
            const pw2 = document.getElementById('reset-password2').value;
            if (pw !== pw2) { showError(t('login.pw_mismatch')); return; }
            const btn = document.getElementById('reset-btn');
            btn.disabled = true; btn.textContent = t('login.resetting');
            document.getElementById('login-error').classList.add('hidden');
            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('reset-username').value.trim(),
                        staff_id: document.getElementById('reset-staffid').value.trim(),
                        password: pw
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    toggleForm('login');
                    document.getElementById('reset-username').value = '';
                    document.getElementById('reset-staffid').value = '';
                    document.getElementById('reset-password').value = '';
                    document.getElementById('reset-password2').value = '';
                    const el = document.getElementById('login-error');
                    el.textContent = t('login.reset_success');
                    el.classList.remove('hidden');
                    el.style.background = '#d1fae5'; el.style.color = '#065f46'; el.style.borderColor = '#6ee7b7';
                } else if (data.error === 'no_staff_id') {
                    showError(t('login.no_staff_id'));
                } else {
                    showError(data.error || 'Reset failed');
                }
            } catch (err) {
                showError(t('login.network_error'));
            }
            btn.disabled = false; btn.textContent = t('login.reset_btn');
        }

        function showError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        let _countdownTimer = null;

        function startLockoutCountdown(seconds) {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            if (_countdownTimer) clearInterval(_countdownTimer);

            function tick() {
                if (seconds <= 0) {
                    clearInterval(_countdownTimer);
                    _countdownTimer = null;
                    document.getElementById('login-error').classList.add('hidden');
                    btn.disabled = false;
                    btn.textContent = t('login.login_btn');
                    return;
                }
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
                showError(`\uD83D\uDD12 Account locked. Try again in ${timeStr}.`);
                btn.textContent = `Locked (${timeStr})`;
                seconds--;
            }
            tick();
            _countdownTimer = setInterval(tick, 1000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const remember = document.getElementById('login-remember').checked;
            btn.disabled = true; btn.textContent = t('login.signing_in');
            document.getElementById('login-error').classList.add('hidden');
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    if (remember) RememberStore.save(username, password);
                    else RememberStore.clear();
                    window.location.href = '/';
                    return;
                } else if (res.status === 429) {
                    startLockoutCountdown(data.locked_for_seconds || 300);
                    return;
                } else if (res.status === 403 && data.error === 'pending_approval') {
                    showError(t('login.pending_approval'));
                } else if (res.status === 403 && data.error === 'declined') {
                    showError(t('login.declined'));
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (err) {
                showError(t('login.network_error'));
            }
            btn.disabled = false; btn.textContent = t('login.login_btn');
        }

        // ── Live Employee preview (debounced lookup against /api/employee-lookup) ──
        let _empLookupTimer = null;
        let _empLookupSeq   = 0;       // generation counter to discard stale responses
        let _empLookupLast  = null;    // last successful employee record (for client-side validation)

        function setEmpStatus(text, kind) {
            const el = document.getElementById('reg-emp-status');
            if (!el) return;
            el.textContent = text || '';
            el.classList.toggle('hidden', !text);
            el.style.color =
                kind === 'ok'    ? '#047857' :
                kind === 'warn'  ? '#b45309' :
                kind === 'error' ? '#b91c1c' : '#6b7280';
        }

        function clearEmpPreview() {
            const box = document.getElementById('reg-emp-preview');
            if (box) box.classList.add('hidden');
            _empLookupLast = null;
        }

        async function performEmpLookup() {
            const input = document.getElementById('reg-employee-id');
            const raw   = (input.value || '').trim();
            const seq   = ++_empLookupSeq;

            if (!raw) { clearEmpPreview(); setEmpStatus('', null); return; }
            if (!/^\d+$/.test(raw)) {
                clearEmpPreview();
                setEmpStatus('Employee ID must be a number', 'error');
                return;
            }

            setEmpStatus('Looking up…', null);
            try {
                const res = await fetch(`/api/employee-lookup/${encodeURIComponent(raw)}`);
                if (seq !== _empLookupSeq) return;        // a newer keystroke is in flight
                if (res.status === 404) {
                    clearEmpPreview();
                    setEmpStatus('No employee with that ID — contact HR', 'error');
                    return;
                }
                if (!res.ok) {
                    clearEmpPreview();
                    setEmpStatus('Lookup failed', 'error');
                    return;
                }
                const data = await res.json();
                _empLookupLast = data;
                document.getElementById('reg-emp-name').textContent     = data.name || '—';
                document.getElementById('reg-emp-dept').textContent     = data.department || '—';
                document.getElementById('reg-emp-position').textContent = data.position || '—';
                document.getElementById('reg-emp-preview').classList.remove('hidden');
                if (data.taken) {
                    setEmpStatus('This Employee ID is already linked to an account', 'warn');
                } else {
                    setEmpStatus('Verified', 'ok');
                }
            } catch (err) {
                if (seq !== _empLookupSeq) return;
                clearEmpPreview();
                setEmpStatus('Network error during lookup', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('reg-employee-id');
            if (!input) return;
            input.addEventListener('input', () => {
                clearTimeout(_empLookupTimer);
                _empLookupTimer = setTimeout(performEmpLookup, 280);
            });
            input.addEventListener('blur', () => {
                clearTimeout(_empLookupTimer);
                performEmpLookup();
            });
        });

        async function handleRegister(e) {
            e.preventDefault();
            const pw  = document.getElementById('reg-password').value;
            const pw2 = document.getElementById('reg-password2').value;
            const empRaw = document.getElementById('reg-employee-id').value.trim();
            if (pw !== pw2)         { showError(t('login.pw_mismatch')); return; }
            if (!/^\d+$/.test(empRaw)) { showError('Employee ID must be a number'); return; }
            // Block submit while a stale lookup is contradictory
            if (_empLookupLast && _empLookupLast.taken) {
                showError('This Employee ID is already linked to an account');
                return;
            }
            const btn = document.getElementById('reg-btn');
            btn.disabled = true; btn.textContent = t('login.creating');
            document.getElementById('login-error').classList.add('hidden');
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username:    document.getElementById('reg-username').value.trim(),
                        password:    pw,
                        employee_id: empRaw,
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showError('');
                    document.getElementById('login-error').classList.add('hidden');
                    toggleForm('login');
                    document.getElementById('login-username').value = document.getElementById('reg-username').value;
                    const successEl = document.getElementById('login-error');
                    successEl.textContent = data.pending ? t('login.pending_approval_after_register') : t('login.account_created');
                    successEl.classList.remove('hidden');
                    successEl.style.background = '#d1fae5'; successEl.style.color = '#065f46'; successEl.style.borderColor = '#6ee7b7';
                } else {
                    showError(data.error || 'Registration failed');
                }
            } catch (err) {
                showError(t('login.network_error'));
            }
            btn.disabled = false; btn.textContent = t('login.create_link');
        }
    </script>
</body>
</html>
