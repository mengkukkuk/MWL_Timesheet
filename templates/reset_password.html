<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The reset token arrives in the URL; never leak it via Referer. -->
    <meta name="referrer" content="no-referrer">
    <title>Reset Password - Team Work Log</title>
    <link rel="stylesheet" href="/static/tailwind.css?v={{ static_v('tailwind.css') }}">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app/i18n.js?v={{ static_v('app/i18n.js') }}"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="login-card" style="position:relative">
        <!-- Language toggle -->
        <div style="position:absolute;top:1rem;right:1rem">
            <button id="lang-toggle-btn" onclick="toggleLang()" class="text-xs font-semibold px-2 py-1 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">TH</button>
        </div>

        <div class="flex items-center justify-center gap-3 mb-6">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-800" data-i18n="reset.title">Set a New Password</h1>
        </div>

        <div id="reset-error" class="error-msg hidden"></div>

        <!-- Invalid / expired link message -->
        <div id="invalid-box" class="hidden text-center">
            <p class="text-sm text-gray-600 mb-4" data-i18n="reset.invalid_link">This reset link is invalid or has expired. Request a new one from the sign-in page.</p>
            <a href="/login" class="text-indigo-600 hover:underline font-medium text-sm" data-i18n="reset.back_to_login">Back to sign in</a>
        </div>

        <!-- New password form -->
        <form id="confirm-form" class="hidden" onsubmit="handleConfirm(event)">
            <p class="text-xs text-gray-500 mb-4" data-i18n="reset.desc">Choose a new password for your account.</p>
            <div class="space-y-3">
                <div>
                    <label class="label" data-i18n="login.password">New Password</label>
                    <input type="password" id="new-password" class="input-field w-full" required autocomplete="new-password" minlength="8" placeholder="Min. 8 characters">
                </div>
                <div>
                    <label class="label" data-i18n="login.confirm_password">Confirm Password</label>
                    <input type="password" id="new-password2" class="input-field w-full" required autocomplete="new-password">
                </div>
            </div>
            <button type="submit" class="btn-primary w-full mt-4" id="confirm-btn" data-i18n="reset.submit_btn">Set new password</button>
            <p class="text-center text-sm text-gray-500 mt-4">
                <a href="/login" class="text-indigo-600 hover:underline font-medium" data-i18n="reset.back_to_login">Back to sign in</a>
            </p>
        </form>
    </div>

    <script>
        // Token comes in via ?token=…; grab it, then scrub it from the URL/history.
        const _resetToken = new URLSearchParams(location.search).get('token') || '';
        history.replaceState(null, '', '/reset-password');

        function showError(msg) {
            const el = document.getElementById('reset-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function showInvalid() {
            document.getElementById('confirm-form').classList.add('hidden');
            document.getElementById('invalid-box').classList.remove('hidden');
        }

        async function initPage() {
            if (!_resetToken) { showInvalid(); return; }
            try {
                const res = await fetch('/api/reset-password/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: _resetToken })
                });
                const data = await res.json();
                if (data.valid) {
                    document.getElementById('confirm-form').classList.remove('hidden');
                } else {
                    showInvalid();
                }
            } catch (err) {
                showError(t('login.network_error'));
            }
        }

        async function handleConfirm(e) {
            e.preventDefault();
            const pw  = document.getElementById('new-password').value;
            const pw2 = document.getElementById('new-password2').value;
            if (pw !== pw2) { showError(t('login.pw_mismatch')); return; }
            const btn = document.getElementById('confirm-btn');
            btn.disabled = true;
            document.getElementById('reset-error').classList.add('hidden');
            try {
                const res = await fetch('/api/reset-password/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: _resetToken, password: pw })
                });
                const data = await res.json();
                if (res.ok) {
                    const el = document.getElementById('reset-error');
                    el.textContent = t('reset.success');
                    el.classList.remove('hidden');
                    el.style.background = '#d1fae5'; el.style.color = '#065f46'; el.style.borderColor = '#6ee7b7';
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                    return;
                } else if (data.error === 'invalid_or_expired') {
                    showInvalid();
                } else {
                    showError(data.error || 'Reset failed');
                }
            } catch (err) {
                showError(t('login.network_error'));
            }
            btn.disabled = false;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>
</html>
