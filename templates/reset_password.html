<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The reset token arrives in the URL; never leak it via Referer. -->
    <meta name="referrer" content="no-referrer">
    <title>Reset Password - Team Work Log</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- auth.css must come last: it owns this page's layout and overrides the
         shared .login-card / .label / .input-field / .btn-primary rules.
         No font <link> here on purpose — this page makes zero third-party
         requests so the reset token can't leak (see CLAUDE.md §7a).
         No tailwind.css either: this page uses no utility classes, so it stays
         correct even before `npm run build:css` has been run on a fresh clone. -->
    <link rel="stylesheet" href="/static/auth.css?v={{ static_v('auth.css') }}">
    <script src="/static/app/i18n.js?v={{ static_v('app/i18n.js') }}"></script>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <button class="lang-toggle" id="lang-toggle-btn" onclick="toggleLang()">TH</button>

            <div class="logo-section">
                <div class="logo-box">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                </div>
                <div class="logo-text" data-i18n="reset.title">Set a New Password</div>
            </div>

            <div id="reset-error" class="error-msg hidden"></div>

            <!-- Invalid / expired link message -->
            <div id="invalid-box" class="hidden text-center">
                <p class="form-subtitle" data-i18n="reset.invalid_link">This reset link is invalid or has expired. Request a new one from the sign-in page.</p>
                <div class="form-footer">
                    <div class="footer-row center">
                        <a href="/login" class="footer-link" data-i18n="reset.back_to_login">Back to sign in</a>
                    </div>
                </div>
            </div>

            <!-- New password form -->
            <form id="confirm-form" class="hidden" onsubmit="handleConfirm(event)">
                <div class="form-header">
                    <p class="form-subtitle" data-i18n="reset.desc">Choose a new password for your account.</p>
                </div>

                <div class="form-group">
                    <label class="label" for="new-password" data-i18n="login.password">New Password</label>
                    <input type="password" id="new-password" class="input-field" required autocomplete="new-password" minlength="8" data-i18n-ph="modal.new_pw_ph" placeholder="Min. 8 characters">
                </div>

                <div class="form-group">
                    <label class="label" for="new-password2" data-i18n="login.confirm_password">Confirm Password</label>
                    <input type="password" id="new-password2" class="input-field" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary" id="confirm-btn" data-i18n="reset.submit_btn">Set new password</button>

                <div class="form-footer">
                    <div class="footer-row center">
                        <a href="/login" class="footer-link" data-i18n="reset.back_to_login">Back to sign in</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Token comes in via ?token=…; grab it, then scrub it from the URL/history.
        const _resetToken = new URLSearchParams(location.search).get('token') || '';
        history.replaceState(null, '', '/reset-password');

        function showError(msg) {
            const el = document.getElementById('reset-error');
            el.textContent = msg;
            el.classList.remove('msg-success');
            el.classList.remove('hidden');
        }

        function showSuccess(msg) {
            const el = document.getElementById('reset-error');
            el.textContent = msg;
            el.classList.add('msg-success');
            el.classList.remove('hidden');
        }

        function showInvalid() {
            document.getElementById('confirm-form').classList.add('hidden');
            document.getElementById('invalid-box').classList.remove('hidden');
        }

        async function initPage() {
            if (!_resetToken) { showInvalid(); return; }
            try {
                const res = await fetch('/api/reset-password/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: _resetToken })
                });
                const data = await res.json();
                if (data.valid) {
                    document.getElementById('confirm-form').classList.remove('hidden');
                } else {
                    showInvalid();
                }
            } catch (err) {
                showError(t('login.network_error'));
            }
        }

        async function handleConfirm(e) {
            e.preventDefault();
            const pw  = document.getElementById('new-password').value;
            const pw2 = document.getElementById('new-password2').value;
            if (pw !== pw2) { showError(t('login.pw_mismatch')); return; }
            const btn = document.getElementById('confirm-btn');
            btn.disabled = true;
            const errEl = document.getElementById('reset-error');
            errEl.classList.add('hidden');
            errEl.classList.remove('msg-success');
            try {
                const res = await fetch('/api/reset-password/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: _resetToken, password: pw })
                });
                const data = await res.json();
                if (res.ok) {
                    showSuccess(t('reset.success'));
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                    return;
                } else if (data.error === 'invalid_or_expired') {
                    showInvalid();
                } else {
                    showError(data.error || 'Reset failed');
                }
            } catch (err) {
                showError(t('login.network_error'));
            }
            btn.disabled = false;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>
</html>
