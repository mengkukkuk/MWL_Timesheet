<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWL Timesheet</title>
    <!-- Locally built + purged replacement for the old unpurged Tailwind CDN
         link (was 2.93 MB / 255 KB compressed; this is ~16 KB / ~4 KB gzip).
         Same tailwindcss@2.2.19 version and default theme, so no utility's
         definition changed — only unused selectors were removed. Kept first
         in <head>, same position the CDN link had, since static/style.css
         is written to load after and override it (see style.css's header
         comment: "extends Tailwind CDN"). Rebuild with `npm run build:css`
         (frontend/) whenever a component starts using a new Tailwind class. -->
    <link rel="stylesheet" href="/static/tailwind.css?v={{ static_v('tailwind.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit&family=Syne:wght@700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ static_v('style.css') }}">
    <!-- Single React SPA bundle (Vite `app` entry -> src/main.tsx -> AppShell).
         AppShell owns the whole UI: nav, selector, tab switching, all islands,
         modals, toast and the draft panel. CSS in head, JS module before </body>. -->
    {% set app_assets = vite_asset('app') %}
    {% for href in app_assets.css %}
    <link rel="stylesheet" href="{{ href }}">
    {% endfor %}
    <!-- Chart.js is lazy-loaded on demand by the dashboard/projects-summary islands. -->
    <style>
/* ── Projects Summary Dashboard (global styles used by the projects-summary island) ── */
.ps-dash-title{font-family:'Syne',-apple-system,sans-serif;font-size:1.375rem;font-weight:800;color:#0f172a;letter-spacing:-.03em}
.ps-dash-subtitle{font-size:.8125rem;color:#94a3b8;margin-top:2px}
.ps-controls{background:#fff;border:1px solid #e2e8f0;border-radius:.625rem;padding:.4375rem .875rem;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:.5rem}
.ps-sel{border:none;outline:none;font-size:.875rem;color:#374151;background:transparent;cursor:pointer;font-weight:500}
.ps-sel:focus{outline:none}

/* KPI */
.ps-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.875rem;margin-bottom:1rem}
.ps-kpi-card{background:#fff;border-radius:.875rem;padding:1.125rem 1.25rem;border:1px solid #f1f5f9;box-shadow:0 1px 4px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.ps-kpi-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px)}
.ps-kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-color,#4f46e5);border-radius:3px 3px 0 0}
.ps-kpi-icon{width:34px;height:34px;border-radius:.5rem;background:var(--kpi-color-bg,#eff6ff);color:var(--kpi-color,#4f46e5);display:flex;align-items:center;justify-content:center;margin-bottom:.75rem}
.ps-kpi-value{font-family:'DM Mono','Courier New',monospace;font-size:1.75rem;font-weight:600;color:#0f172a;letter-spacing:-.04em;line-height:1;display:block}
.ps-kpi-label{font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin-top:.3125rem;display:block}

/* Charts */
.ps-charts-row{display:grid;grid-template-columns:1fr 300px;gap:.875rem;margin-bottom:1rem;align-items:start}
.ps-chart-card{background:#fff;border-radius:.875rem;padding:1.25rem 1.5rem;border:1px solid #f1f5f9;box-shadow:0 1px 4px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03)}
.ps-chart-title{font-family:'Syne',sans-serif;font-size:.9375rem;font-weight:700;color:#1e293b}
.ps-chart-sub{font-size:.75rem;color:#94a3b8;margin-top:2px;margin-bottom:1rem}

/* Donut legend */
.ps-legend{display:flex;flex-direction:column;gap:.3125rem}
.ps-legend-item{display:flex;align-items:center;gap:.5rem;font-size:.75rem;padding:.1875rem 0}
.ps-legend-swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ps-legend-name{flex:1;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-legend-pct{font-family:'DM Mono',monospace;font-size:.6875rem;color:#64748b;font-weight:500;white-space:nowrap}

/* Detail table */
.ps-detail-card{background:#fff;border-radius:.875rem;border:1px solid #f1f5f9;box-shadow:0 1px 4px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);overflow:hidden}
.ps-detail-header{padding:.875rem 1.25rem;border-bottom:1px solid #f8fafc;display:flex;align-items:center;gap:.4375rem;background:#fafbfc}
.ps-detail-title{font-family:'Syne',sans-serif;font-size:.8125rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.07em}
.ps-proj-row{border-bottom:1px solid #f8fafc;cursor:pointer;transition:background .1s}
.ps-proj-row:hover{background:#f8fafc}
.ps-proj-row.expanded{background:#fafbfc}
.ps-emp-row{border-bottom:1px solid #f1f5f9;background:#fafbfd}
.ps-hours-badge{display:inline-flex;align-items:center;font-family:'DM Mono',monospace;font-size:.75rem;font-weight:600;padding:.1875rem .625rem;border-radius:2rem;background:#eff6ff;color:#1d4ed8}
.ps-hours-badge.emp{background:#f0fdf4;color:#15803d;font-size:.6875rem;font-weight:500}
.ps-share-bar-bg{background:#f1f5f9;border-radius:4px;height:6px;overflow:hidden;width:100%}
.ps-share-bar-fill{height:100%;border-radius:4px;background:var(--bar-color,#4f46e5);transition:width .6s cubic-bezier(.4,0,.2,1)}
.ps-share-pct{font-family:'DM Mono',monospace;font-size:.6875rem;color:#94a3b8;min-width:3.5ch;text-align:right}
.ps-chevron{transition:transform .2s;color:#94a3b8}
.ps-chevron.open{transform:rotate(90deg)}
.ps-proj-color-bar{width:3px;border-radius:2px;display:inline-block;flex-shrink:0}
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Single mount point for the React SPA. AppShell renders all chrome,
         tab content, modals, toast and the draft panel into here. -->
    <div id="root"></div>

    {% for src in app_assets.js %}
    <script type="module" src="{{ src }}"></script>
    {% endfor %}
</body>
</html>
